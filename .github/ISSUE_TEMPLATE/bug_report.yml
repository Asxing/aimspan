name: Bug report
description: Report a reproducible problem in AimSpan.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic examples only. Do not upload real transcripts, databases, credentials or unredacted screenshots.
        Report vulnerabilities privately at https://github.com/Asxing/aimspan/security/advisories/new.
  - type: input
    id: version
    attributes:
      label: AimSpan version
      description: Release version or source commit, and whether this is a downloaded or locally built app.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      placeholder: macOS version; Apple silicon or Intel
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Affected source
      multiple: true
      options:
        - Claude desktop Code tab
        - Claude Code CLI
        - Claude Code VS Code
        - Codex desktop
        - Codex CLI
        - Codex VS Code
        - No particular source
    validations:
      required: true
  - type: input
    id: source-version
    attributes:
      label: Agent app or CLI version
      description: Include the affected app, CLI or VS Code extension version if known.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use invented session titles, text and paths; replace usernames with __aimspan_fixture__.
      placeholder: |
        1. Open...
        2. Do...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Optional screenshots must show synthetic sessions and ideas only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: This report contains no real transcripts, user databases, credentials or personal data.
          required: true
